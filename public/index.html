<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgileKanban</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1d2637; --border:#2a3448;
    --text:#e6ebf5; --muted:#8b98b3; --accent:#6366f1; --accent2:#818cf8;
    --green:#34d399; --yellow:#fbbf24; --red:#ef4444; --purple:#a78bfa; --blue:#38bdf8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--text); min-height:100vh; font-size:14px;}
  header{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border);
         padding:14px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  header .logo{font-weight:800; font-size:17px; letter-spacing:-.3px;}
  header .logo span{color:var(--accent2);}
  .toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-left:auto;}
  button{background:var(--panel2); border:1px solid var(--border); color:var(--text);
         padding:8px 13px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
         transition:.15s; white-space:nowrap;}
  button:hover{border-color:var(--accent2); background:#232e45;}
  button.primary{background:var(--accent); border-color:var(--accent);}
  button.primary:hover{background:var(--accent2);}
  button.ghost{background:transparent;}
  button.active{background:var(--accent); border-color:var(--accent);}
  input,select,textarea{background:var(--bg); border:1px solid var(--border); color:var(--text);
         padding:8px 10px; border-radius:8px; font-size:13px; font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent2);}
  select option{background:var(--panel2);}
  .container{padding:16px 20px; max-width:1400px; margin:0 auto;}
  .conn{font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; border:1px solid var(--border);
        display:inline-flex; align-items:center; gap:6px; color:var(--muted);}
  .conn::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--muted);}
  .conn.ok{color:var(--green);} .conn.ok::before{background:var(--green);}
  .conn.bad{color:var(--red);} .conn.bad::before{background:var(--red);}
  .conn.loading{color:var(--yellow);} .conn.loading::before{background:var(--yellow);}
  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:10px;
        padding:10px 16px; min-width:120px;}
  .stat .num{font-size:22px; font-weight:800;}
  .stat .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .board{display:flex; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:8px;}
  .col{background:var(--panel); border:1px solid var(--border); border-radius:12px;
       min-width:250px; flex:1; display:flex; flex-direction:column; max-height:calc(100vh - 170px);}
  .col-head{padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px;}
  .dot{width:9px; height:9px; border-radius:50%;}
  .col-head .count{background:var(--panel2); border-radius:10px; padding:1px 8px; font-size:12px; color:var(--muted);}
  .col-body{padding:10px; overflow-y:auto; flex:1; min-height:60px; display:flex; flex-direction:column; gap:10px;}
  .col-body.drag-over{background:rgba(99,102,241,.08);}
  .card{background:var(--panel2); border:1px solid var(--border); border-radius:10px;
        padding:10px 12px; cursor:grab;}
  .card:hover{border-color:var(--accent2);}
  .card.dragging{opacity:.4;}
  .card .t{font-weight:700; font-size:13.5px; line-height:1.35; margin-bottom:6px;}
  .card .d{color:var(--muted); font-size:12px; line-height:1.4; margin-bottom:8px;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .badges{display:flex; gap:5px; flex-wrap:wrap; align-items:center;}
  .badge{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,.06);
         border:1px solid var(--border);}
  .badge.p-low{color:var(--green);} .badge.p-medium{color:var(--yellow);}
  .badge.p-high{color:var(--red);} .badge.p-urgent{color:#fff; background:var(--red); border-color:var(--red);}
  .badge.overdue{color:#fff; background:var(--red); border-color:var(--red);}
  .badge.assignee{color:var(--blue);}
  .badge.sprint{color:var(--purple);}
  .empty{color:var(--muted); font-size:12px; text-align:center; padding:18px 6px; font-style:italic;}
  .timeline-wrap{background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:auto;}
  .tl-inner{min-width:900px;}
  .tl-head{display:flex; position:sticky; top:0; background:var(--panel); z-index:2; border-bottom:1px solid var(--border);}
  .tl-label{width:230px; min-width:230px; padding:10px 14px; font-weight:700; border-right:1px solid var(--border);}
  .tl-days{display:flex; flex:1;}
  .dl{flex:1; min-width:34px; text-align:center; padding:8px 0; border-right:1px solid rgba(255,255,255,.04);
      font-size:11px; color:var(--muted);}
  .dl .dd{font-weight:800; color:var(--text); font-size:13px; display:block;}
  .dl.today{background:rgba(99,102,241,.14);}
  .dl.weekend{background:rgba(255,255,255,.02);}
  .tl-row{display:flex; border-bottom:1px solid var(--border); position:relative;}
  .tl-row .tl-label{padding:9px 14px; display:flex; flex-direction:column; gap:2px; border-right:1px solid var(--border);}
  .tl-row .tl-label .tt{font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-row .tl-label .ts{font-size:11px; color:var(--muted);}
  .tl-track{flex:1; position:relative; min-height:40px;}
  .bar{position:absolute; top:8px; height:24px; border-radius:6px; padding:0 8px; font-size:11px; font-weight:700;
       color:#0f1420; display:flex; align-items:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
       box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .bar.st-done{background:var(--green);} .bar.st-inprogress{background:var(--yellow);}
  .bar.st-review{background:var(--purple); color:#fff;} .bar.st-todo{background:var(--blue);}
  .bar.st-backlog{background:#94a3b8;}
  .bar.overdue{outline:2px solid var(--red); outline-offset:1px;}
  .today-line{position:absolute; top:0; bottom:0; width:2px; background:var(--accent2); z-index:1;}
  /* sprints */
  .sprint-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .sprint-head h2{font-size:18px;}
  .sprint-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px;}
  .sprint-card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px;
        cursor:pointer; transition:.15s;}
  .sprint-card:hover{border-color:var(--accent2);}
  .sprint-card .sc-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .sprint-card .sc-head strong{font-size:14px;}
  .sprint-card .sc-dates{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
  .sprint-card .sc-goal{font-size:12px; color:var(--muted); line-height:1.4; margin-bottom:10px;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .sprint-card .sc-meta{font-size:11.5px; color:var(--muted); margin-top:8px;}
  .badge.s-st-planned{color:var(--blue);} .badge.s-st-active{color:var(--yellow);} .badge.s-st-done{color:var(--green);}
  .progress{background:var(--bg); border:1px solid var(--border); border-radius:20px; height:8px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent2); border-radius:20px; transition:width .3s;}
  .sd-tasks{margin-top:12px; display:flex; flex-direction:column; gap:6px;}
  .sd-task{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;
        display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px;}
  .burndown{width:100%; margin:10px 0;}
  .burndown svg{width:100%; height:auto; background:var(--bg); border:1px solid var(--border); border-radius:8px;}
  .hint{color:var(--muted); font-size:12px; margin-top:6px; margin-bottom:10px;}
  .offline{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:30px;
           text-align:center; margin-top:10px;}
  .offline p{color:var(--muted); margin:10px 0;}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:50;
           align-items:center; justify-content:center; padding:20px;}
  .overlay.open{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; width:520px;
         max-width:100%; max-height:90vh; overflow:auto; padding:20px;}
  .modal h3{margin-bottom:16px; font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{min-height:70px; resize:vertical;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .modal-actions{display:flex; gap:8px; margin-top:16px; justify-content:flex-end;}
  #delBtn{margin-right:auto;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--green); color:#0f1420;
         padding:10px 18px; border-radius:8px; font-weight:700; opacity:0; pointer-events:none; transition:.3s; z-index:60;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="logo">Agile<span>Kanban</span></div>
  <div class="toolbar">
    <span id="conn" class="conn loading">Menghubungkan…</span>
    <input id="search" placeholder="Cari tugas…" style="width:150px;">
    <select id="fAssignee"><option value="">Semua orang</option></select>
    <select id="fPriority">
      <option value="">Semua prioritas</option>
      <option value="low">Low</option><option value="medium">Medium</option>
      <option value="high">High</option><option value="urgent">Urgent</option>
    </select>
    <button id="viewBoard" class="active">Board</button>
    <button id="viewTimeline">Timeline</button>
    <button id="viewSprint">Sprint</button>
    <button id="btnSample" class="ghost">Contoh data</button>
    <button id="btnExport" class="ghost">Export</button>
    <button id="btnImport" class="ghost">Import</button>
    <button id="btnAdd" class="primary">+ Tambah Tugas</button>
  </div>
</header>

<div class="container">
  <div class="stats" id="stats"></div>
  <div class="board" id="board" style="display:none;"></div>
  <div class="timeline-wrap" id="timeline" style="display:none;"></div>
  <div class="sprints" id="sprints" style="display:none;"></div>
  <div class="offline" id="offline" style="display:none;">
    <p><strong>API tidak terjangkau.</strong></p>
    <p id="offlineMsg" style="font-family:monospace; font-size:12px;"></p>
    <button id="btnRetry" class="primary">Coba lagi</button>
  </div>
  <p class="hint">Tips: drag kartu antar kolom untuk ubah status · klik kartu untuk edit · data tersimpan di PostgreSQL via REST API.</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Tambah Tugas</h3>
    <div class="field">
      <label>Judul tugas *</label>
      <input id="mTitle" placeholder="Contoh: Update halaman checkout">
    </div>
    <div class="field">
      <label>Deskripsi</label>
      <textarea id="mDesc" placeholder="Detail, acceptance criteria, dll…"></textarea>
    </div>
    <div class="field">
      <label>Assignee</label>
      <input id="mAssignee" placeholder="Nama (mis. R Hanif)">
    </div>
    <div class="row2">
      <div class="field">
        <label>Prioritas</label>
        <select id="mPriority">
          <option value="medium">Medium</option><option value="low">Low</option>
          <option value="high">High</option><option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="field">
        <label>Status / Kolom</label>
        <select id="mStatus">
          <option value="backlog">Backlog</option><option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>
          <option value="review">Review</option><option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Estimasi (story point)</label>
        <input id="mPoints" type="number" min="0" step="1" placeholder="mis. 3">
      </div>
      <div class="field">
        <label>Mulai</label>
        <input id="mStart" type="date">
      </div>
      <div class="field">
        <label>Tenggat (due)</label>
        <input id="mDue" type="date">
      </div>
    </div>
    <div class="field">
      <label>Sprint (opsional)</label>
      <select id="mSprint"><option value="">Tanpa sprint</option></select>
    </div>
    <div class="modal-actions">
      <button id="delBtn" class="ghost" style="color:var(--red); border-color:var(--red); display:none;">Hapus</button>
      <button id="btnCancel" class="ghost">Batal</button>
      <button id="btnSave" class="primary">Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="sprintOverlay">
  <div class="modal">
    <h3 id="sprintModalTitle">Sprint Baru</h3>
    <div class="field">
      <label>Nama sprint *</label>
      <input id="sName" placeholder="mis. Sprint 1">
    </div>
    <div class="field">
      <label>Goal</label>
      <textarea id="sGoal" placeholder="Target sprint…"></textarea>
    </div>
    <div class="row2">
      <div class="field"><label>Mulai</label><input id="sStart" type="date"></div>
      <div class="field"><label>Selesai</label><input id="sEnd" type="date"></div>
    </div>
    <div class="field">
      <label>Status</label>
      <select id="sStatus">
        <option value="planned">Planned</option>
        <option value="active">Active</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="modal-actions">
      <button id="sCancel" class="ghost">Batal</button>
      <button id="sSave" class="primary">Simpan</button>
    </div>
  </div>
</div>

<div class="overlay" id="sprintDetailOverlay">
  <div class="modal" style="width:620px;">
    <h3 id="sdName">Sprint</h3>
    <div class="badges" id="sdBadges" style="margin-bottom:8px;"></div>
    <div id="sdInfo" style="color:var(--muted); font-size:12.5px; margin-bottom:6px;"></div>
    <div id="sdGoal" style="color:var(--muted); font-size:13px; margin-bottom:10px;"></div>
    <div class="burndown" id="sdBurndown"></div>
    <div class="sd-tasks" id="sdTasks"></div>
    <div class="modal-actions">
      <button id="sdDelete" class="ghost" style="color:var(--red); border-color:var(--red);">Hapus</button>
      <button id="sdStart" class="ghost">Mulai Sprint</button>
      <button id="sdComplete" class="primary">Selesaikan Sprint</button>
      <button id="sdClose" class="ghost">Tutup</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Tersimpan</div>
<input type="file" id="importFile" accept=".json" style="display:none;">

<script>
(function(){
  const COLUMNS = [
    {id:'backlog',  label:'Backlog',      color:'#94a3b8'},
    {id:'todo',     label:'To Do',        color:'#38bdf8'},
    {id:'inprogress',label:'In Progress', color:'#fbbf24'},
    {id:'review',   label:'Review',       color:'#a78bfa'},
    {id:'done',     label:'Done',         color:'#34d399'},
  ];
  const PRIORITY_LABEL = {low:'Low', medium:'Medium', high:'High', urgent:'Urgent'};
  const SPRINT_LABEL = {planned:'Planned', active:'Active', done:'Done'};

  let tasks = [];
  let sprints = [];
  let view = 'board';
  let editingId = null;
  let editingSprintId = null;
  let draggedId = null;
  let wasDragged = false;

  const $ = id => document.getElementById(id);
  const todayStr = toISO(new Date());

  function toISO(d){ if(typeof d === 'string') d = parseDate(d); return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function parseDate(s){ if(!s) return null; const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function isOverdue(t){ return t.due && t.status !== 'done' && t.due < todayStr; }

  function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1600); }

  async function api(url, opts = {}){
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if(!res.ok){
      let msg = res.statusText;
      try { const j = await res.json(); if(j && j.error) msg = j.error; } catch(e){}
      throw new Error(msg || ('HTTP ' + res.status));
    }
    return res.json();
  }

  function setConn(state, msg){
    const el = $('conn');
    el.className = 'conn ' + state;
    el.textContent = state === 'ok' ? 'Terhubung ke API' : state === 'bad' ? 'API offline' : 'Menghubungkan…';
    if(state === 'bad' && msg){ $('offlineMsg').textContent = msg; }
    $('offline').style.display = state === 'bad' ? 'block' : 'none';
    $('board').style.display = state === 'bad' ? 'none' : (view === 'board' ? 'flex' : 'none');
    $('timeline').style.display = state === 'bad' ? 'none' : (view === 'timeline' ? 'block' : 'none');
    $('sprints').style.display = state === 'bad' ? 'none' : (view === 'sprint' ? 'block' : 'none');
  }

  async function loadTasks(){
    setConn('loading');
    try {
      tasks = await api('/api/tasks');
      sprints = await api('/api/sprints');
      setConn('ok');
      render();
    } catch(e){
      tasks = []; sprints = [];
      setConn('bad', e.message);
    }
  }

  function render(){ renderStats(); renderBoard(); renderTimeline(); renderSprints(); populateFilters(); populateSprintOptions(); }

  function renderStats(){
    const total = tasks.length;
    const done = tasks.filter(t => t.status === 'done').length;
    const inProg = tasks.filter(t => t.status === 'inprogress').length;
    const overdue = tasks.filter(isOverdue).length;
    const points = tasks.reduce((s,t) => s + (parseFloat(t.points)||0), 0);
    const pointsDone = tasks.filter(t => t.status==='done').reduce((s,t) => s + (parseFloat(t.points)||0), 0);
    $('stats').innerHTML =
      stat(total,'Total tugas') + stat(done,'Selesai') + stat(inProg,'On progress') +
      stat(overdue,'Overdue') + stat(points,'Total poin') +
      stat((total ? Math.round(pointsDone/points*100)||0 : 0), '% poin done');
  }
  function stat(n,l){ return `<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`; }

  function populateFilters(){
    const assignees = [...new Set(tasks.map(t => t.assignee).filter(Boolean))].sort();
    const sel = $('fAssignee'); const cur = sel.value;
    sel.innerHTML = '<option value="">Semua orang</option>' +
      assignees.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
    if(assignees.includes(cur)) sel.value = cur;
  }

  function populateSprintOptions(){
    const sel = $('mSprint'); const cur = sel.value;
    sel.innerHTML = '<option value="">Tanpa sprint</option>' +
      sprints.map(s => `<option value="${s.id}">${esc(s.name)}${s.status==='done'?' (selesai)':''}</option>`).join('');
    if(cur) sel.value = cur;
  }

  function filteredTasks(){
    const q = $('search').value.trim().toLowerCase();
    const a = $('fAssignee').value;
    const p = $('fPriority').value;
    return tasks.filter(t => {
      if(q && !(t.title+' '+(t.description||'')).toLowerCase().includes(q)) return false;
      if(a && t.assignee !== a) return false;
      if(p && t.priority !== p) return false;
      return true;
    });
  }

  function renderBoard(){
    const board = $('board');
    board.innerHTML = COLUMNS.map(c => {
      const items = filteredTasks().filter(t => t.status === c.id);
      return `<div class="col" data-col="${c.id}">
        <div class="col-head"><span class="dot" style="background:${c.color}"></span>
          <strong>${c.label}</strong><span class="count">${items.length}</span></div>
        <div class="col-body" data-col="${c.id}">
          ${items.map(t => cardHTML(t)).join('') || '<div class="empty">Tidak ada</div>'}
        </div>
      </div>`;
    }).join('');
  }

  function cardHTML(t){
    const overdue = isOverdue(t);
    const p = t.priority || 'medium';
    let b = `<span class="badge p-${p}">${PRIORITY_LABEL[p]||p}</span>`;
    if(t.points) b += `<span class="badge">${t.points} pt</span>`;
    if(t.assignee) b += `<span class="badge assignee">${esc(t.assignee)}</span>`;
    if(t.sprintId){
      const sp = sprints.find(x => x.id === t.sprintId);
      if(sp) b += `<span class="badge sprint">Sprint: ${esc(sp.name)}</span>`;
    }
    if(t.due){
      b += overdue ? `<span class="badge overdue">⚠ ${t.due}</span>` : `<span class="badge">📅 ${t.due}</span>`;
    }
    return `<div class="card" draggable="true" data-id="${t.id}">
      <div class="t">${esc(t.title)}</div>
      ${t.description ? `<div class="d">${esc(t.description)}</div>` : ''}
      <div class="badges">${b}</div>
    </div>`;
  }

  function renderTimeline(){
    const tl = $('timeline');
    const items = filteredTasks();
    if(!items.length){ tl.innerHTML = '<div class="empty" style="padding:30px;">Belum ada tugas. Tambahkan tugas dulu.</div>'; return; }

    const today = new Date(); today.setHours(0,0,0,0);
    let min = today, max = addDays(today, 20);
    items.forEach(t => {
      if(t.start){ const d = parseDate(t.start); if(d && d < min) min = d; }
      if(t.due){ const d = parseDate(t.due); if(d && d > max) max = d; }
    });
    min = addDays(min, -1); max = addDays(max, 2);

    const days = [];
    for(let d = new Date(min); d <= max; d = addDays(d,1)) days.push(new Date(d));
    const axis0 = min.getTime();

    const dayLabels = days.map(d => {
      const isToday = toISO(d) === todayStr;
      const weekend = d.getDay()===0 || d.getDay()===6;
      const dn = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()];
      return `<div class="dl ${isToday?'today':''} ${weekend?'weekend':''}">
        <span class="dd">${d.getDate()}</span>${dn}<br><span style="font-size:9px;">${d.getMonth()+1}/${d.getFullYear()}</span>
      </div>`;
    }).join('');

    const pct = 100/days.length;
    const tLineLeft = ((parseDate(todayStr).getTime()-axis0)/86400000) * pct;

    const rows = items.map(t => {
      const s = t.start ? parseDate(t.start) : (parseDate(t.due) || today);
      const e = t.due ? parseDate(t.due) : s;
      const left = Math.max(0, (s.getTime() - axis0) / 86400000);
      const right = Math.min(days.length, (e.getTime() - axis0)/86400000 + 1);
      const width = right - left;
      if(width <= 0) return '';
      const overdue = isOverdue(t);
      return `<div class="tl-row">
        <div class="tl-label"><span class="tt">${esc(t.title)}</span>
          <span class="ts">${COLUMNS.find(c=>c.id===t.status).label}${t.assignee?' · '+esc(t.assignee):''}</span></div>
        <div class="tl-track">
          <div class="today-line" style="left:${tLineLeft}%"></div>
          <div class="bar st-${t.status} ${overdue?'overdue':''}"
               style="left:${left*pct}%; width:${Math.max(1, width*pct)}%;" title="${esc(t.title)}">${esc(t.title)}</div>
        </div>
      </div>`;
    }).join('');

    tl.innerHTML = `<div class="tl-inner">
      <div class="tl-head"><div class="tl-label">Tugas</div><div class="tl-days">${dayLabels}</div></div>
      ${rows}
    </div>`;
  }

  function renderSprints(){
    const el = $('sprints');
    const cards = sprints.map(s => {
      const total = s.totalPoints || 0;
      const done = s.donePoints || 0;
      const pct = total ? Math.round(done/total*100) : 0;
      const stLabel = SPRINT_LABEL[s.status] || s.status;
      return `<div class="sprint-card" data-id="${s.id}">
        <div class="sc-head"><strong>${esc(s.name)}</strong><span class="badge s-st-${s.status}">${stLabel}</span></div>
        <div class="sc-dates">📅 ${s.start||'—'} → ${s.due||'—'}</div>
        ${s.goal ? `<div class="sc-goal">🎯 ${esc(s.goal)}</div>` : ''}
        <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="sc-meta">${done}/${total} poin · ${s.taskCount||0} tugas</div>
      </div>`;
    }).join('');
    el.innerHTML = `<div class="sprint-head"><h2>Sprint</h2><button id="btnAddSprint" class="primary">＋ Sprint Baru</button></div>` +
      `<div class="sprint-grid">${cards || '<div class="empty">Belum ada sprint. Klik "＋ Sprint Baru".</div>'}</div>`;
  }

  function burndownSVG(sprint, sprintTasks){
    if(!sprint.start || !sprint.due) return '<div class="hint">Atur tanggal mulai & selesai sprint untuk melihat burndown.</div>';
    const start = parseDate(sprint.start), end = parseDate(sprint.due);
    const days = [];
    for(let d = new Date(start); d <= end; d = addDays(d,1)) days.push(new Date(d));
    if(days.length < 2) return '<div class="hint">Rentang sprint terlalu pendek untuk burndown.</div>';

    const total = sprintTasks.reduce((s,t) => s + (parseFloat(t.points)||0), 0);
    const completedByDay = {};
    sprintTasks.forEach(t => {
      if(t.status === 'done' && t.completedAt){
        const d = toISO(new Date(t.completedAt));
        completedByDay[d] = (completedByDay[d]||0) + (parseFloat(t.points)||0);
      }
    });

    const W = 560, H = 230, padL = 46, padR = 14, padT = 16, padB = 30;
    const n = days.length;
    const x = i => padL + (W-padL-padR) * (i/(n-1));
    const y = v => padT + (H-padT-padB) * (1 - (total ? v/total : 0));

    const idealPts = days.map((_,i) => {
      const remaining = total * (1 - i/(n-1));
      return `${x(i).toFixed(1)},${y(remaining).toFixed(1)}`;
    }).join(' ');

    let cum = total;
    const actualPts = days.map((_,i) => {
      if(i > 0) cum -= (completedByDay[toISO(days[i])]||0);
      return `${x(i).toFixed(1)},${y(Math.max(0,cum)).toFixed(1)}`;
    }).join(' ');

    let grid = '';
    for(let g=0; g<=4; g++){
      const v = total*g/4;
      grid += `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="#2a3448" stroke-width="1"/>` +
        `<text x="${padL-6}" y="${(y(v)+4).toFixed(1)}" fill="#8b98b3" font-size="10" text-anchor="end">${Math.round(v)}</text>`;
    }

    const xLabels = days.map((d,i) => {
      if(i === 0 || i === n-1 || i % Math.ceil(n/8) === 0)
        return `<text x="${x(i).toFixed(1)}" y="${H-padB+14}" fill="#8b98b3" font-size="9" text-anchor="middle">${d.getDate()}/${d.getMonth()+1}</text>`;
      return '';
    }).join('');

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${grid}
      <line x1="${padL}" y1="${y(0).toFixed(1)}" x2="${W-padR}" y2="${y(0).toFixed(1)}" stroke="#2a3448"/>
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#2a3448"/>
      ${xLabels}
      <polyline points="${idealPts}" fill="none" stroke="#8b98b3" stroke-width="2" stroke-dasharray="5,4"/>
      <polyline points="${actualPts}" fill="none" stroke="#818cf8" stroke-width="2.5"/>
      <text x="${W-padR}" y="${padT+10}" fill="#8b98b3" font-size="9" text-anchor="end">— ideal</text>
      <text x="${W-padR}" y="${padT+22}" fill="#818cf8" font-size="9" text-anchor="end">— aktual</text>
    </svg>`;
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function setView(v){
    view = v;
    $('board').style.display = v==='board' ? 'flex' : 'none';
    $('timeline').style.display = v==='timeline' ? 'block' : 'none';
    $('sprints').style.display = v==='sprint' ? 'block' : 'none';
    $('viewBoard').classList.toggle('active', v==='board');
    $('viewTimeline').classList.toggle('active', v==='timeline');
    $('viewSprint').classList.toggle('active', v==='sprint');
    if(v==='sprint') renderSprints();
  }

  /* ---------- task modal ---------- */
  function openModal(task){
    editingId = task ? task.id : null;
    $('modalTitle').textContent = task ? 'Edit Tugas' : 'Tambah Tugas';
    $('mTitle').value = task ? task.title : '';
    $('mDesc').value = task ? (task.description||'') : '';
    $('mAssignee').value = task ? (task.assignee||'') : '';
    $('mPriority').value = task ? (task.priority||'medium') : 'medium';
    $('mStatus').value = task ? task.status : 'todo';
    $('mPoints').value = task ? (task.points||'') : '';
    $('mStart').value = task ? (task.start||'') : '';
    $('mDue').value = task ? (task.due||'') : '';
    $('mSprint').value = task ? (task.sprintId||'') : '';
    $('delBtn').style.display = task ? 'block' : 'none';
    $('overlay').classList.add('open');
    setTimeout(() => $('mTitle').focus(), 30);
  }
  function closeModal(){ $('overlay').classList.remove('open'); editingId = null; }

  /* ---------- sprint modal ---------- */
  function openSprintModal(sprint){
    editingSprintId = sprint ? sprint.id : null;
    $('sprintModalTitle').textContent = sprint ? 'Edit Sprint' : 'Sprint Baru';
    $('sName').value = sprint ? sprint.name : '';
    $('sGoal').value = sprint ? (sprint.goal||'') : '';
    $('sStatus').value = sprint ? sprint.status : 'planned';
    $('sStart').value = sprint ? (sprint.start||'') : '';
    $('sEnd').value = sprint ? (sprint.due||'') : '';
    $('sprintOverlay').classList.add('open');
    setTimeout(() => $('sName').focus(), 30);
  }
  function closeSprintModal(){ $('sprintOverlay').classList.remove('open'); editingSprintId = null; }

  async function openSprintDetail(id){
    try {
      const s = await api('/api/sprints/' + id);
      const stLabel = SPRINT_LABEL[s.status] || s.status;
      $('sdName').textContent = s.name;
      $('sdBadges').innerHTML = `<span class="badge s-st-${s.status}">${stLabel}</span>` +
        (s.totalPoints != null ? `<span class="badge">${s.donePoints||0}/${s.totalPoints||0} poin</span>` : '');
      $('sdInfo').textContent = `📅 ${s.start||'—'} → ${s.due||'—'}`;
      $('sdGoal').textContent = s.goal ? `🎯 ${s.goal}` : '';
      $('sdTasks').innerHTML = s.tasks.length
        ? s.tasks.map(t => {
            const st = COLUMNS.find(c => c.id === t.status);
            return `<div class="sd-task">
              <span>${esc(t.title)}${t.points?' · '+t.points+' pt':''}</span>
              <span class="badge" style="color:${st.color}; border-color:${st.color}">${st.label}</span>
            </div>`;
          }).join('')
        : '<div class="empty">Belum ada tugas di sprint ini.</div>';
      $('sdBurndown').innerHTML = burndownSVG(s, s.tasks);
      $('sdStart').style.display = s.status === 'planned' ? '' : 'none';
      $('sdComplete').style.display = s.status === 'active' ? '' : 'none';
      $('sprintDetailOverlay').dataset.id = id;
      $('sprintDetailOverlay').classList.add('open');
    } catch(e){ toast('Gagal buka sprint: ' + e.message); }
  }

  async function patchSprintStatus(status){
    const id = $('sprintDetailOverlay').dataset.id;
    if(!id) return;
    try {
      const s = await api('/api/sprints/' + id, { method: 'PATCH', body: { status } });
      const i = sprints.findIndex(x => x.id === id);
      if(i >= 0) sprints[i] = s;
      render(); openSprintDetail(id); toast('Sprint diperbarui ✓');
    } catch(e){ toast(e.message); }
  }

  function sampleData(){
    const today = new Date();
    return [
      {title:'Setup repo & CI pipeline', description:'Init repo, konfigurasi GitHub Actions (lint + test).', assignee:'R Hanif', priority:'high', status:'done', points:5, start:toISO(addDays(today,-4)), due:toISO(addDays(today,-1))},
      {title:'Halaman checkout baru', description:'Redesign flow checkout, integrate payment gateway.', assignee:'Budi', priority:'urgent', status:'inprogress', points:8, start:toISO(addDays(today,-2)), due:toISO(addDays(today,3))},
      {title:'Unit test modul cart', description:'Coverage target 80%.', assignee:'R Hanif', priority:'high', status:'todo', points:5, start:toISO(today), due:toISO(addDays(today,5))},
      {title:'API get product list', description:'Endpoint + dokumentasi OpenAPI.', assignee:'Sari', priority:'medium', status:'todo', points:3, start:toISO(addDays(today,1)), due:toISO(addDays(today,6))},
      {title:'Bug: total harga salah', description:'Diskon tidak terhitung saat checkout.', assignee:'Budi', priority:'urgent', status:'backlog', points:2, start:toISO(today), due:toISO(addDays(today,1))},
      {title:'Retrospective sprint 1', description:'Catat action items.', assignee:'', priority:'low', status:'backlog', points:1, start:toISO(addDays(today,6)), due:toISO(addDays(today,8))},
    ];
  }

  /* ---------- events ---------- */
  $('btnAdd').onclick = () => openModal(null);
  $('btnCancel').onclick = closeModal;
  $('overlay').onclick = e => { if(e.target === $('overlay')) closeModal(); };
  $('viewBoard').onclick = () => setView('board');
  $('viewTimeline').onclick = () => setView('timeline');
  $('viewSprint').onclick = () => setView('sprint');
  $('search').oninput = render;
  $('fAssignee').onchange = render;
  $('fPriority').onchange = render;
  $('btnRetry').onclick = loadTasks;

  $('sCancel').onclick = closeSprintModal;
  $('sprintOverlay').onclick = e => { if(e.target === $('sprintOverlay')) closeSprintModal(); };

  $('sSave').onclick = async () => {
    const name = $('sName').value.trim();
    if(!name){ toast('Nama sprint wajib diisi'); $('sName').focus(); return; }
    const data = { name, goal: $('sGoal').value.trim(), status: $('sStatus').value, start: $('sStart').value, due: $('sEnd').value };
    try {
      if(editingSprintId){
        const s = await api('/api/sprints/' + editingSprintId, { method: 'PATCH', body: data });
        const i = sprints.findIndex(x => x.id === editingSprintId);
        if(i >= 0) sprints[i] = s;
      } else {
        const s = await api('/api/sprints', { method: 'POST', body: data });
        sprints.unshift(s);
      }
      closeSprintModal(); render(); toast('Sprint tersimpan ✓');
    } catch(e){ toast('Error: ' + e.message); }
  };

  $('sdClose').onclick = () => $('sprintDetailOverlay').classList.remove('open');
  $('sdStart').onclick = () => patchSprintStatus('active');
  $('sdComplete').onclick = () => patchSprintStatus('done');
  $('sdDelete').onclick = async () => {
    const id = $('sprintDetailOverlay').dataset.id;
    if(!id) return;
    if(!confirm('Hapus sprint ini? Tugas di dalamnya tidak terhapus (hanya lepas dari sprint).')) return;
    try {
      await api('/api/sprints/' + id, { method: 'DELETE' });
      sprints = sprints.filter(s => s.id !== id);
      $('sprintDetailOverlay').classList.remove('open');
      render(); toast('Sprint dihapus ✓');
    } catch(e){ toast('Gagal hapus: ' + e.message); }
  };

  $('btnSave').onclick = async () => {
    const title = $('mTitle').value.trim();
    if(!title){ toast('Judul wajib diisi'); $('mTitle').focus(); return; }
    const data = {
      title,
      description: $('mDesc').value.trim(),
      assignee: $('mAssignee').value.trim(),
      priority: $('mPriority').value,
      status: $('mStatus').value,
      points: $('mPoints').value,
      start: $('mStart').value,
      due: $('mDue').value,
      sprintId: $('mSprint').value || null,
    };
    try {
      if(editingId){
        const t = await api('/api/tasks/' + editingId, { method: 'PUT', body: data });
        const idx = tasks.findIndex(x => x.id === editingId);
        if(idx >= 0) tasks[idx] = t;
      } else {
        const t = await api('/api/tasks', { method: 'POST', body: data });
        tasks.unshift(t);
      }
      closeModal(); render(); toast('Tersimpan ✓');
    } catch(e){ toast('Error: ' + e.message); }
  };

  $('delBtn').onclick = async () => {
    if(!editingId) return;
    try {
      await api('/api/tasks/' + editingId, { method: 'DELETE' });
      tasks = tasks.filter(t => t.id !== editingId);
      toast('Dihapus ✓');
    } catch(e){ toast('Gagal hapus: ' + e.message); }
    closeModal(); render();
  };

  $('btnSample').onclick = async () => {
    if(tasks.length && !confirm('Tambahkan contoh di atas data yang ada?')) return;
    try {
      const created = await api('/api/tasks/bulk', { method: 'POST', body: sampleData() });
      tasks = tasks.concat(created);
      render(); toast('Contoh ditambahkan ✓');
    } catch(e){ toast('Gagal: ' + e.message); }
  };

  $('btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kanban-tasks-export.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Diexport');
  };

  $('btnImport').onclick = () => $('importFile').click();
  $('importFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const data = JSON.parse(r.result);
        if(!Array.isArray(data)) throw new Error('bukan array');
        const created = await api('/api/tasks/bulk', { method: 'POST', body: data });
        tasks = tasks.concat(created);
        render(); toast('Diimpor ✓ (' + created.length + ' tugas)');
      } catch(err){ toast('Import gagal: ' + err.message); }
      e.target.value = '';
    };
    r.readAsText(f);
  };

  /* ---------- drag & drop ---------- */
  document.addEventListener('dragstart', e => {
    const card = e.target.closest('.card');
    if(!card) return;
    draggedId = card.dataset.id;
    wasDragged = false;
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', draggedId);
  });
  document.addEventListener('dragend', e => {
    const card = e.target.closest('.card');
    if(card) card.classList.remove('dragging');
    draggedId = null;
    setTimeout(() => wasDragged = false, 50);
  });
  document.addEventListener('dragover', e => {
    const body = e.target.closest('.col-body');
    if(body){ e.preventDefault(); body.classList.add('drag-over'); }
  });
  document.addEventListener('dragleave', e => {
    const body = e.target.closest('.col-body');
    if(body) body.classList.remove('drag-over');
  });
  document.addEventListener('drop', async e => {
    const body = e.target.closest('.col-body');
    if(body && draggedId){
      e.preventDefault();
      body.classList.remove('drag-over');
      const t = tasks.find(x => x.id === draggedId);
      if(t){
        const prev = t.status;
        t.status = body.dataset.col;
        render(); // optimistic
        try {
          const upd = await api('/api/tasks/' + t.id, { method: 'PATCH', body: { status: t.status } });
          Object.assign(t, upd);
          render();
        } catch(err){
          t.status = prev; render(); toast('Gagal pindah: ' + err.message);
        }
      }
      wasDragged = true;
    }
  });

  document.addEventListener('click', e => {
    if(wasDragged){ wasDragged = false; return; }
    const card = e.target.closest('.card');
    if(card){ const t = tasks.find(x => x.id === card.dataset.id); if(t) openModal(t); return; }
    if(e.target.closest('#btnAddSprint')){ openSprintModal(null); return; }
    const sc = e.target.closest('.sprint-card');
    if(sc){ openSprintDetail(sc.dataset.id); }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if($('overlay').classList.contains('open')) closeModal();
      if($('sprintOverlay').classList.contains('open')) closeSprintModal();
      if($('sprintDetailOverlay').classList.contains('open')) $('sprintDetailOverlay').classList.remove('open');
    }
  });

  setView('board');
  loadTasks();
})();
</script>
</body>
</html>
